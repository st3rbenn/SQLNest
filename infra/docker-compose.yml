# Environnements de dev locaux pour SQLNest.
#   docker compose -f infra/docker-compose.yml up -d
# Postgres est le moteur de référence de la Slice 5 (connexion). Mongo est
# présent pour les slices suivantes (introspection/exécution cross-db).
# Identifiants de DEV uniquement — ne jamais réutiliser en prod.

services:
  postgres:
    image: postgres:16-alpine
    container_name: sqlnest-postgres
    environment:
      POSTGRES_USER: sqlnest
      POSTGRES_PASSWORD: sqlnest
      POSTGRES_DB: sqlnest_demo
    # Hôte 5433 (pas 5432) pour cohabiter avec un PostgreSQL installé
    # nativement, qui occupe fréquemment 5432 sur les postes de dev.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlnest -d sqlnest_demo"]
      interval: 3s
      timeout: 3s
      retries: 15

  # Postgres APPLICATIF — isolé du Postgres démo. Stocke les données SQLNest
  # (users, sessions, canvas_state — au fur et à mesure des phases auth).
  # Port hôte 5434 pour ne pas entrer en conflit avec le Postgres démo (5433)
  # ni un Postgres natif (5432). Identifiants DEV uniquement.
  postgres-app:
    image: postgres:16-alpine
    container_name: sqlnest-postgres-app
    environment:
      POSTGRES_USER: sqlnest_app
      POSTGRES_PASSWORD: sqlnest_app_dev
      POSTGRES_DB: sqlnest_app
    ports:
      - "5434:5432"
    volumes:
      - pgdata_app:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlnest_app -d sqlnest_app"]
      interval: 3s
      timeout: 3s
      retries: 15

  # Postgres de TEST — dédié aux tests d'intégration Vitest (auth,
  # canvas-state). ISOLÉ du postgres-app (dev) : le beforeEach des tests
  # int fait `TRUNCATE user, session, account, verification, canvas_state`,
  # ce qui doit ABSOLUMENT ne jamais toucher les données dev.
  #
  # Port hôte 5435 pour rester distinct de 5432/5433/5434.
  # Nom/user/pwd contiennent explicitement `test` — pattern qu'on assert
  # côté code (guard runtime dans `truncateAuthTables`) : impossible de
  # TRUNCATE une DB dont l'URL ne matche pas `_test`.
  postgres-test:
    image: postgres:16-alpine
    container_name: sqlnest-postgres-test
    environment:
      POSTGRES_USER: sqlnest_test
      POSTGRES_PASSWORD: sqlnest_test_dev
      POSTGRES_DB: sqlnest_test
    ports:
      - "5435:5432"
    # Pas de volume persistant : la DB test est éphémère, elle est
    # recréée à chaque `db:up` et migrée au démarrage des tests.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlnest_test -d sqlnest_test"]
      interval: 3s
      timeout: 3s
      retries: 15

  # Mongo dev : replica set single-node — requis pour les TRANSACTIONS
  # (mongod standalone ne les supporte pas). Init du RS via 00-init-rs.js dans
  # /docker-entrypoint-initdb.d, avant les seeds de données. Auth désactivée en
  # local (dev only) — évite le keyFile ceremony du RS. Les clients doivent
  # se connecter avec `?directConnection=true` pour cibler ce membre unique
  # sans découverte de topologie.
  mongo:
    image: mongo:7
    container_name: sqlnest-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: sqlnest_demo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      - ./mongo/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "rs.status().ok || rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  pgdata_app:
  mongodata:

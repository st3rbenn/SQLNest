# SQLNest frontend — nginx static SPA
# Pas de reverse proxy /api ici : Caddy (edge) route /api/* → backend
# et /* → ce nginx.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression — Caddy compresse aussi mais on garde nginx pour le
    # cas où on servirait cet image sans Caddy devant.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets buildés par Vite : hashés dans le nom → immutable long TTL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Config runtime : jamais cachée, réécrite à chaque redéploiement.
    location = /config/context.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # SPA fallback — TanStack Router BrowserHistory, deep links doivent
    # tomber sur index.html côté client.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
